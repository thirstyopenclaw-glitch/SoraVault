<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoraVault</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-dim: #8888a0;
            --accent: #00e5ff;
            --accent2: #ff00d4;
            --accent-glow: rgba(0, 229, 255, 0.3);
            --gold: #ffd700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--surface) 0%, #0d0d18 100%);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .stats-bar {
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .stats-bar .stat-value { color: var(--accent); font-weight: 600; }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 9px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-box::placeholder { color: var(--text-dim); }

        select, .btn {
            padding: 9px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        select:hover, .btn:hover { border-color: var(--accent); }
        .btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

        /* Layout: sidebar + main */
        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            min-width: 220px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px 0;
            height: calc(100vh - 110px);
            position: sticky;
            top: 110px;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 16px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }

        .sidebar-item:hover {
            background: var(--surface2);
            border-left-color: var(--accent);
        }

        .sidebar-item.active {
            background: var(--surface2);
            border-left-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .sidebar-item .count {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg);
            padding: 1px 6px;
            border-radius: 10px;
        }

        .sidebar-item.active .count { color: var(--accent); }

        /* Main content */
        .main {
            flex: 1;
            overflow-y: auto;
            height: calc(100vh - 110px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            padding: 16px 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.12);
        }

        .card-video {
            width: 100%;
            aspect-ratio: 9/16;
            max-height: 380px;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .card-no-video {
            width: 100%;
            aspect-ratio: 9/16;
            max-height: 380px;
            background: linear-gradient(135deg, var(--surface2), var(--bg));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 36px;
        }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .card-source-badge {
            position: absolute;
            top: 8px;
            left: 38px;
            background: rgba(0, 0, 0, 0.75);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--accent2);
        }

        .card-star {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 18px;
            cursor: pointer;
            filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
            z-index: 5;
            transition: transform 0.2s;
        }

        .card-star:hover { transform: scale(1.3); }
        .card-star.starred { color: var(--gold); }
        .card-star:not(.starred) { color: #555; }

        .card-info { padding: 10px 12px; }

        .card-caption {
            font-size: 12px;
            line-height: 1.4;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .card-meta {
            display: flex;
            gap: 10px;
            font-size: 11px;
            color: var(--text-dim);
        }

        .card-meta .likes { color: var(--accent); font-weight: 600; }
        .card-meta .views { color: var(--accent2); }

        .card-cameos { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 5px; }

        .cameo-tag {
            font-size: 9px;
            padding: 1px 5px;
            background: var(--surface2);
            border-radius: 3px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
        }

        .cameo-tag:hover { color: var(--accent); border-color: var(--accent); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-video {
            width: 100%;
            max-height: 60vh;
            object-fit: contain;
            background: #000;
            border-radius: 16px 16px 0 0;
        }

        .modal-body { padding: 20px; }
        .modal-body h3 { font-size: 14px; margin-bottom: 6px; color: var(--accent); }

        .modal-prompt {
            background: var(--surface2);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .modal-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 10px;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .modal-stats span { color: var(--text-dim); }
        .modal-stats strong { color: var(--accent); }

        .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
        .modal-actions .btn { font-size: 12px; padding: 8px 14px; }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: var(--text-dim);
            cursor: pointer;
            z-index: 210;
        }

        .modal-close:hover { color: var(--text); }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 16px 20px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            font-size: 15px;
        }

        /* Section header in main */
        .section-header {
            padding: 16px 20px 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header .clear-filter {
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            font-weight: 400;
        }

        .section-header .clear-filter:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .header { padding: 12px; }
            .grid { padding: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
            .stats-bar { display: none; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="logo">SORAVAULT</div>
        <div class="stats-bar" id="statsBar"></div>
    </div>
    <div class="controls">
        <input type="text" class="search-box" id="searchBox" placeholder="Search prompts, captions, cameos...">
        <select id="sortSelect">
            <option value="likes">Top Liked</option>
            <option value="views">Most Viewed</option>
            <option value="date">Newest</option>
            <option value="duration">Longest</option>
        </select>
        <select id="minLikes">
            <option value="0">Any Likes</option>
            <option value="10">10+ Likes</option>
            <option value="50">50+ Likes</option>
            <option value="100">100+ Likes</option>
        </select>
        <button class="btn" id="starredBtn" onclick="toggleStarred()">Starred</button>
    </div>
</div>

<div class="layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Sources</div>
            <div id="sourceList"></div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">Cameos</div>
            <div id="cameoList"></div>
        </div>
    </div>

    <div class="main" id="mainContent">
        <div class="section-header" id="sectionHeader" style="display:none"></div>
        <div class="grid" id="videoGrid"></div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <div class="modal" onclick="event.stopPropagation()">
        <video class="modal-video" id="modalVideo" controls></video>
        <div class="modal-body">
            <div class="modal-stats" id="modalStats"></div>
            <h3>Prompt</h3>
            <div class="modal-prompt" id="modalPrompt"></div>
            <h3>Caption</h3>
            <div class="modal-prompt" id="modalCaption"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;
    let searchTimeout = null;
    let showStarred = false;
    let activeSource = '';
    let activeCameo = '';

    async function loadStats() {
        const res = await fetch('/api/stats');
        const s = await res.json();
        document.getElementById('statsBar').innerHTML = `
            <span><span class="stat-value">${s.total.toLocaleString()}</span> videos</span>
            <span><span class="stat-value">${s.with_video.toLocaleString()}</span> files</span>
            <span><span class="stat-value">${s.total_likes.toLocaleString()}</span> likes</span>
            <span><span class="stat-value">${s.total_views.toLocaleString()}</span> views</span>
            <span><span class="stat-value">${s.starred}</span> starred</span>
        `;
    }

    async function loadSidebar() {
        // Sources
        const srcRes = await fetch('/api/sources');
        const sources = await srcRes.json();
        const srcList = document.getElementById('sourceList');

        const sourceLabels = {
            'v2_feed': 'Feed',
            'v2_draft': 'Drafts',
        };

        let srcHtml = `<div class="sidebar-item ${!activeSource ? 'active' : ''}" onclick="filterSource('')">
            All <span class="count">${sources.reduce((a,s) => a+s.count, 0)}</span>
        </div>`;
        for (const s of sources) {
            const label = sourceLabels[s.source] || s.source.replace('cameo_', '');
            srcHtml += `<div class="sidebar-item ${activeSource === s.source ? 'active' : ''}"
                             onclick="filterSource('${s.source}')">
                ${escHtml(label)} <span class="count">${s.count}</span>
            </div>`;
        }
        srcList.innerHTML = srcHtml;

        // Cameos
        const camRes = await fetch('/api/cameos');
        const cameos = await camRes.json();
        const camList = document.getElementById('cameoList');

        let camHtml = `<div class="sidebar-item ${!activeCameo ? 'active' : ''}" onclick="filterCameo('')">
            All Cameos <span class="count">${cameos.reduce((a,c) => a+c.count, 0)}</span>
        </div>`;
        for (const c of cameos.slice(0, 25)) {
            const shortName = c.name.length > 22 ? c.name.substring(0, 20) + '...' : c.name;
            camHtml += `<div class="sidebar-item ${activeCameo === c.name ? 'active' : ''}"
                             onclick="filterCameo('${escAttr(c.name)}')">
                ${escHtml(shortName)} <span class="count">${c.count}</span>
            </div>`;
        }
        camList.innerHTML = camHtml;
    }

    function filterSource(source) {
        activeSource = source;
        activeCameo = '';
        loadSidebar();
        loadVideos(1);
        updateSectionHeader();
    }

    function filterCameo(cameo) {
        activeCameo = cameo;
        activeSource = '';
        if (cameo) {
            document.getElementById('searchBox').value = cameo;
        } else {
            document.getElementById('searchBox').value = '';
        }
        loadSidebar();
        loadVideos(1);
        updateSectionHeader();
    }

    function updateSectionHeader() {
        const header = document.getElementById('sectionHeader');
        if (activeSource || activeCameo) {
            const label = activeCameo || activeSource.replace('cameo_', '').replace('v2_', '');
            header.innerHTML = `${escHtml(label)} <span class="clear-filter" onclick="clearFilters()">Clear filter</span>`;
            header.style.display = 'flex';
        } else {
            header.style.display = 'none';
        }
    }

    function clearFilters() {
        activeSource = '';
        activeCameo = '';
        document.getElementById('searchBox').value = '';
        loadSidebar();
        loadVideos(1);
        updateSectionHeader();
    }

    async function loadVideos(page = 1) {
        currentPage = page;
        const q = document.getElementById('searchBox').value;
        const sort = document.getElementById('sortSelect').value;
        const minLikes = document.getElementById('minLikes').value;

        const params = new URLSearchParams({
            q, sort, source: activeSource, min_likes: minLikes,
            page, per_page: 48,
            video_only: 'true',
            starred: showStarred ? 'true' : '',
        });

        const res = await fetch(`/api/videos?${params}`);
        const data = await res.json();
        const grid = document.getElementById('videoGrid');

        if (data.videos.length === 0) {
            grid.innerHTML = '<div class="empty-state">No videos found</div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        grid.innerHTML = data.videos.map(v => {
            const sourceLabel = v.source ? v.source.replace('cameo_', '').replace('v2_', '') : '';
            return `
            <div class="card" onclick="openModal('${v.id}')">
                <span class="card-star ${v.starred ? 'starred' : ''}"
                      onclick="event.stopPropagation(); toggleStar('${v.id}', this)">
                    ${v.starred ? '\u2605' : '\u2606'}
                </span>
                ${v.has_video ? `
                    <video class="card-video" muted loop preload="metadata"
                           onmouseenter="this.play()" onmouseleave="this.pause();this.currentTime=0"
                           src="/video/${v.id}#t=0.5">
                    </video>
                ` : `<div class="card-no-video">No Video</div>`}
                <div class="card-badge">${v.duration_s ? v.duration_s.toFixed(0) + 's' : '?'}</div>
                ${sourceLabel.startsWith('cameo') || sourceLabel === 'draft' ? `<div class="card-source-badge">${escHtml(sourceLabel)}</div>` : ''}
                <div class="card-info">
                    <div class="card-caption">${escHtml(v.caption || v.prompt || 'No caption')}</div>
                    <div class="card-meta">
                        <span class="likes">${v.like_count || 0} likes</span>
                        <span class="views">${v.view_count || 0} views</span>
                        <span>${v.posted_at_human || ''}</span>
                    </div>
                    ${v.cameos.length ? `
                        <div class="card-cameos">
                            ${v.cameos.map(c => `<span class="cameo-tag" onclick="event.stopPropagation(); filterCameo('${escAttr(c)}')">${escHtml(c)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            </div>
        `}).join('');

        const pag = document.getElementById('pagination');
        if (data.pages > 1) {
            let html = '';
            if (page > 1) html += `<button class="btn" onclick="loadVideos(${page - 1})">Prev</button>`;
            html += `<span>Page ${page} / ${data.pages} (${data.total.toLocaleString()} videos)</span>`;
            if (page < data.pages) html += `<button class="btn" onclick="loadVideos(${page + 1})">Next</button>`;
            pag.innerHTML = html;
        } else {
            pag.innerHTML = `<span>${data.total.toLocaleString()} videos</span>`;
        }
    }

    async function openModal(id) {
        const modal = document.getElementById('modal');
        const video = document.getElementById('modalVideo');
        video.src = `/video/${id}`;
        video.play();

        const res2 = await fetch(`/api/videos?q=${encodeURIComponent(id)}&per_page=1&video_only=false`);
        const data = await res2.json();
        const v = data.videos[0];

        if (v) {
            document.getElementById('modalStats').innerHTML = `
                <span>Likes: <strong>${v.like_count}</strong></span>
                <span>Views: <strong>${v.view_count}</strong></span>
                <span>Shares: <strong>${v.share_count}</strong></span>
                <span>Type: ${v.generation_type || '?'}</span>
                <span>Duration: ${v.duration_s ? v.duration_s.toFixed(1) + 's' : '?'}</span>
                <span>${v.width || '?'}x${v.height || '?'}</span>
                <span>Source: ${v.source || '?'}</span>
            `;
            document.getElementById('modalPrompt').textContent = v.prompt || '(none)';
            document.getElementById('modalCaption').textContent = v.caption || '(none)';
            document.getElementById('modalActions').innerHTML = `
                ${v.permalink ? `<a href="${v.permalink}" target="_blank" class="btn">View on Sora</a>` : ''}
                <button class="btn" onclick="copyPrompt(\`${escAttr(v.prompt || v.caption || '')}\`)">Copy Prompt</button>
            `;
        }

        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
        if (e && e.target !== e.currentTarget && !e.target.classList.contains('modal-close')) return;
        document.getElementById('modal').classList.remove('active');
        document.getElementById('modalVideo').pause();
        document.body.style.overflow = '';
    }

    async function toggleStar(id, el) {
        const isStarred = el.classList.contains('starred');
        await fetch(`/api/videos/${id}/star`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({starred: !isStarred}),
        });
        el.classList.toggle('starred');
        el.textContent = isStarred ? '\u2606' : '\u2605';
        loadStats();
    }

    function toggleStarred() {
        showStarred = !showStarred;
        document.getElementById('starredBtn').classList.toggle('active', showStarred);
        loadVideos(1);
    }

    function copyPrompt(text) {
        navigator.clipboard.writeText(text);
    }

    function escHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function escAttr(s) {
        return s.replace(/'/g, "\\'").replace(/`/g, '\\`').replace(/\n/g, ' ');
    }

    // Event listeners
    document.getElementById('searchBox').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        activeCameo = '';
        searchTimeout = setTimeout(() => loadVideos(1), 300);
    });
    document.getElementById('sortSelect').addEventListener('change', () => loadVideos(1));
    document.getElementById('minLikes').addEventListener('change', () => loadVideos(1));

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal(e);
    });

    // Init
    loadStats();
    loadSidebar();
    loadVideos(1);
</script>

</body>
</html>
