<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino — CruiseQuest</title>
    <style>
        :root {
            --navy: #1a1f3a;
            --navy-dark: #0f1224;
            --navy-light: #252b4a;
            --gold: #f5c842;
            --gold-dark: #c99e1a;
            --gold-glow: rgba(245, 200, 66, 0.35);
            --text: #f0eada;
            --text-dim: #9999bb;
            --green: #2ecc71;
            --red: #e74c3c;
            --surface: #1e2440;
            --border: #2e3560;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at top, #1e2a55 0%, var(--navy-dark) 60%);
            color: var(--text);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: rgba(15, 18, 36, 0.95);
            border-bottom: 2px solid var(--gold-dark);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold);
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 12px var(--gold-glow);
        }

        .nav-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-family: sans-serif;
            padding: 7px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-link:hover { border-color: var(--gold); color: var(--gold); }

        /* Casino wrapper */
        .casino-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px 48px;
        }

        .casino-title {
            font-size: 36px;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .casino-subtitle {
            color: var(--text-dim);
            font-family: sans-serif;
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Machine */
        .machine {
            background: linear-gradient(160deg, var(--navy-light), var(--navy-dark));
            border: 3px solid var(--gold-dark);
            border-radius: 24px;
            padding: 32px 28px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(245, 200, 66, 0.15), inset 0 0 30px rgba(0,0,0,0.4);
        }

        .machine-label {
            text-align: center;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--gold-dark);
            text-transform: uppercase;
            margin-bottom: 20px;
            font-family: sans-serif;
        }

        /* Credits */
        .credits-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--navy-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 24px;
            font-family: 'Courier New', monospace;
        }

        .credits-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .credits-value { font-size: 24px; color: var(--gold); font-weight: bold; }
        .bet-control { display: flex; align-items: center; gap: 8px; }
        .bet-btn {
            background: var(--navy-light);
            border: 1px solid var(--border);
            color: var(--text);
            width: 28px; height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-family: sans-serif;
            line-height: 1;
            transition: all 0.15s;
        }
        .bet-btn:hover { border-color: var(--gold); color: var(--gold); }
        .bet-value { font-size: 16px; color: var(--gold); min-width: 28px; text-align: center; }

        /* Reels */
        .reels-window {
            background: #000;
            border: 2px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .reels-window::before,
        .reels-window::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 40px;
            z-index: 5;
            pointer-events: none;
        }

        .reels-window::before { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
        .reels-window::after  { bottom: 0; background: linear-gradient(to top,   rgba(0,0,0,0.7), transparent); }

        .win-line {
            position: absolute;
            left: 0; right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 90px;
            border-top: 2px solid rgba(245, 200, 66, 0.35);
            border-bottom: 2px solid rgba(245, 200, 66, 0.35);
            z-index: 4;
            pointer-events: none;
        }

        .reels {
            display: flex;
            gap: 0;
        }

        .reel {
            flex: 1;
            border-right: 1px solid #1a1a2e;
            overflow: hidden;
            height: 270px;
            position: relative;
        }

        .reel:last-child { border-right: none; }

        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.05s linear;
            will-change: transform;
        }

        .reel-cell {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            user-select: none;
            flex-shrink: 0;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-spin {
            flex: 1;
            padding: 16px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: 12px;
            color: #1a1200;
            font-size: 17px;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(245, 200, 66, 0.3);
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--gold-glow);
        }

        .btn-spin:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-max {
            padding: 16px 20px;
            background: var(--navy-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-dim);
            font-size: 13px;
            font-family: sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-max:hover { border-color: var(--gold); color: var(--gold); }

        /* Result message */
        .result-msg {
            min-height: 38px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s;
            font-family: sans-serif;
        }

        .result-msg.win  { color: var(--green); background: rgba(46, 204, 113, 0.12); }
        .result-msg.lose { color: var(--red);   background: rgba(231, 76, 60, 0.10); }
        .result-msg.jackpot {
            color: var(--gold);
            background: rgba(245, 200, 66, 0.15);
            text-shadow: 0 0 16px var(--gold-glow);
            animation: pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; } }

        /* Paytable */
        .paytable {
            width: 100%;
            max-width: 420px;
            margin-top: 28px;
            background: rgba(15, 18, 36, 0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        .paytable h3 {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 14px;
            text-align: center;
            font-family: sans-serif;
        }

        .pay-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: sans-serif;
            font-size: 13px;
        }

        .pay-row:last-child { border-bottom: none; }
        .pay-symbols { letter-spacing: 2px; font-size: 20px; }
        .pay-mult { color: var(--gold); font-weight: bold; }

        /* Confetti canvas */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
        }

        @media (max-width: 480px) {
            .casino-title { font-size: 26px; }
            .reel-cell { font-size: 38px; }
            .machine { padding: 20px 16px; }
        }
    </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="header">
    <a href="/" class="logo">🚢 CruiseQuest</a>
    <a href="/" class="nav-link">← Back to Harbor</a>
</div>

<div class="casino-wrap">
    <div class="casino-title">🎰 Ship's Casino</div>
    <div class="casino-subtitle">Try your luck on the high seas</div>

    <div class="machine">
        <div class="machine-label">⚓ Lucky Anchor Slots ⚓</div>

        <div class="credits-bar">
            <div>
                <div class="credits-label">Credits</div>
                <div class="credits-value" id="creditsDisplay">500</div>
            </div>
            <div class="bet-control">
                <div class="credits-label" style="text-align:right">Bet</div>
                <button class="bet-btn" onclick="changeBet(-5)">−</button>
                <div class="bet-value" id="betDisplay">10</div>
                <button class="bet-btn" onclick="changeBet(5)">+</button>
            </div>
        </div>

        <div class="reels-window">
            <div class="win-line"></div>
            <div class="reels">
                <div class="reel" id="reel0"><div class="reel-strip" id="strip0"></div></div>
                <div class="reel" id="reel1"><div class="reel-strip" id="strip1"></div></div>
                <div class="reel" id="reel2"><div class="reel-strip" id="strip2"></div></div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-spin" id="spinBtn" onclick="spin()">SPIN</button>
            <button class="btn-max" onclick="maxBet()">MAX BET</button>
        </div>

        <div class="result-msg" id="resultMsg"></div>
    </div>

    <div class="paytable">
        <h3>Paytable — Pays per bet unit</h3>
        <div class="pay-row"><span class="pay-symbols">🎰🎰🎰</span><span class="pay-mult">JACKPOT × 50</span></div>
        <div class="pay-row"><span class="pay-symbols">⚓⚓⚓</span><span class="pay-mult">× 20</span></div>
        <div class="pay-row"><span class="pay-symbols">🚢🚢🚢</span><span class="pay-mult">× 15</span></div>
        <div class="pay-row"><span class="pay-symbols">💎💎💎</span><span class="pay-mult">× 12</span></div>
        <div class="pay-row"><span class="pay-symbols">🐬🐬🐬</span><span class="pay-mult">× 8</span></div>
        <div class="pay-row"><span class="pay-symbols">🍹🍹🍹</span><span class="pay-mult">× 6</span></div>
        <div class="pay-row"><span class="pay-symbols">🌊🌊🌊</span><span class="pay-mult">× 4</span></div>
        <div class="pay-row"><span class="pay-symbols">Any two matching</span><span class="pay-mult">× 1.5</span></div>
    </div>
</div>

<script>
    const SYMBOLS = ['🎰','⚓','🚢','💎','🐬','🍹','🌊','🃏'];
    const WEIGHTS  = [  1,   3,   4,   5,   7,   9,  10,  11]; // lower = rarer

    const PAYOUTS = {
        '🎰🎰🎰': 50,
        '⚓⚓⚓':   20,
        '🚢🚢🚢':  15,
        '💎💎💎':  12,
        '🐬🐬🐬':   8,
        '🍹🍹🍹':   6,
        '🌊🌊🌊':   4,
    };

    let credits = 500;
    let bet = 10;
    let spinning = false;

    const CELL_H = 90;
    const STRIP_LEN = 30; // symbols per reel strip

    function weightedRandom() {
        const total = WEIGHTS.reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        for (let i = 0; i < SYMBOLS.length; i++) {
            r -= WEIGHTS[i];
            if (r <= 0) return SYMBOLS[i];
        }
        return SYMBOLS[SYMBOLS.length - 1];
    }

    function buildStrip(targetIdx) {
        // Returns array of symbols, guaranteed to have target at index 1 (visible center)
        const arr = [];
        for (let i = 0; i < STRIP_LEN; i++) arr.push(weightedRandom());
        arr[1] = SYMBOLS[targetIdx]; // ensure reproducible center
        return arr;
    }

    function renderStrip(stripEl, symbols) {
        stripEl.innerHTML = symbols.map(s => `<div class="reel-cell">${s}</div>`).join('');
    }

    function initReels() {
        for (let r = 0; r < 3; r++) {
            const strip = document.getElementById(`strip${r}`);
            const symbols = [];
            for (let i = 0; i < STRIP_LEN; i++) symbols.push(weightedRandom());
            renderStrip(strip, symbols);
            strip.style.transform = `translateY(${-CELL_H}px)`;
        }
    }

    function updateUI() {
        document.getElementById('creditsDisplay').textContent = credits;
        document.getElementById('betDisplay').textContent = bet;
        document.getElementById('spinBtn').disabled = spinning || credits < bet;
    }

    function changeBet(delta) {
        if (spinning) return;
        bet = Math.max(5, Math.min(credits, bet + delta));
        updateUI();
    }

    function maxBet() {
        if (spinning) return;
        bet = Math.min(credits, 50);
        updateUI();
    }

    function spin() {
        if (spinning || credits < bet) return;
        spinning = true;
        credits -= bet;
        updateUI();

        const resultMsg = document.getElementById('resultMsg');
        resultMsg.className = 'result-msg';
        resultMsg.textContent = '';

        // Pick final symbols
        const finals = [weightedRandom(), weightedRandom(), weightedRandom()];

        // Animate each reel
        const delays = [0, 300, 600];
        const durations = [1200, 1500, 1800];
        let done = 0;

        for (let r = 0; r < 3; r++) {
            const strip = document.getElementById(`strip${r}`);
            const totalCells = STRIP_LEN;
            const targetSymbol = finals[r];

            // Build a new strip with target at center
            const symbols = [];
            for (let i = 0; i < totalCells; i++) symbols.push(weightedRandom());
            // put target at position (totalCells - 2) so it lands in center visible slot
            symbols[totalCells - 2] = targetSymbol;
            renderStrip(strip, symbols);

            // Start at top, scroll to landing position
            const landingY = -CELL_H * (totalCells - 3); // show cells totalCells-3, -2, -1
            strip.style.transition = 'none';
            strip.style.transform = `translateY(0px)`;

            const delay = delays[r];
            const duration = durations[r];

            setTimeout(() => {
                strip.style.transition = `transform ${duration}ms cubic-bezier(0.15,0,0.2,1)`;
                strip.style.transform = `translateY(${landingY}px)`;

                setTimeout(() => {
                    done++;
                    if (done === 3) resolveResult(finals);
                }, duration);
            }, delay);
        }
    }

    function resolveResult(finals) {
        spinning = false;
        const key = finals.join('');
        const resultMsg = document.getElementById('resultMsg');

        let multiplier = 0;
        if (PAYOUTS[key]) {
            multiplier = PAYOUTS[key];
        } else {
            // Check two-of-a-kind
            const counts = {};
            finals.forEach(s => counts[s] = (counts[s] || 0) + 1);
            const maxCount = Math.max(...Object.values(counts));
            if (maxCount >= 2) multiplier = 1.5;
        }

        if (multiplier > 0) {
            const win = Math.round(bet * multiplier);
            credits += win;
            if (key === '🎰🎰🎰') {
                resultMsg.className = 'result-msg jackpot';
                resultMsg.textContent = `🎉 JACKPOT! +${win} credits!`;
                launchConfetti();
            } else if (multiplier >= 8) {
                resultMsg.className = 'result-msg win';
                resultMsg.textContent = `🎊 Big Win! +${win} credits!`;
            } else {
                resultMsg.className = 'result-msg win';
                resultMsg.textContent = `✓ You win ${win} credits!`;
            }
        } else {
            resultMsg.className = 'result-msg lose';
            resultMsg.textContent = 'No match — try again!';
        }

        if (credits <= 0) {
            credits = 500;
            setTimeout(() => {
                resultMsg.className = 'result-msg';
                resultMsg.textContent = '🚢 Refilled to 500 credits — bon voyage!';
            }, 1500);
        }

        updateUI();
    }

    // Simple confetti
    function launchConfetti() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = Array.from({length: 120}, () => ({
            x: Math.random() * canvas.width,
            y: -20,
            vx: (Math.random() - 0.5) * 4,
            vy: Math.random() * 4 + 2,
            color: ['#f5c842','#00e5ff','#ff00d4','#2ecc71','#ffffff'][Math.floor(Math.random() * 5)],
            size: Math.random() * 8 + 4,
            angle: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.2,
        }));

        let frame;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let alive = false;
            pieces.forEach(p => {
                if (p.y > canvas.height + 20) return;
                alive = true;
                p.x += p.vx; p.y += p.vy; p.angle += p.spin; p.vy += 0.05;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                ctx.restore();
            });
            if (alive) frame = requestAnimationFrame(draw);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        if (frame) cancelAnimationFrame(frame);
        draw();
    }

    initReels();
    updateUI();
</script>

</body>
</html>
